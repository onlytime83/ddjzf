function loadImageFromDataURL(dataURL) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = reject;
    img.src = dataURL;
  });
}

// ===== Navigation =====
function switchPage(name) {
  $$('.page').forEach(p => p.classList.remove('active'));
  $('#page-' + name).classList.add('active');
  $$('.nav-tab').forEach(t => t.classList.toggle('active', t.dataset.page === name));
  // W1：副标题现在位于采集页内部，不再切换 Header 类
  if (name === 'collect') {
    // 进入采集页时 collect-subtitle 可能刚被插入或从 display:none 变成可见，重新 fit 一行大字
    requestAnimationFrame(() => fitSubtitleLine());
  }
  if (name === 'library') renderLibrary();
  if (name === 'create') {
    syncCreateUIFromState();
    renderPaper();
  }
  if (name === 'collect') {
    // 回采集页时如果 state.image 丢失但 blobs.lastSourceImage 还在，重新恢复，
    //   避免"去创作保存后再回采集古籍原图不见了"
    const redraw = () => {
      resizeCollectCanvas();
      if (state.image) {
        // scale/offset 可能在 resize 后越界，兜底 fit
        if (!(state.scale > 0 && state.scale <= 10)) {
          fitImageToCanvas();
        } else {
          drawCollectCanvas();
        }
      } else if ($('#collect-empty')) {
        $('#collect-empty').style.display = 'block';
        if ($('#collect-editor')) $('#collect-editor').style.display = 'none';
      }
    };
    if (state.image) {
      requestAnimationFrame(redraw);
    } else {
      // 没有内存中的 image 对象：从 IndexedDB lastSourceImage 异步恢复
      (async () => {
        try {
          const savedBlob = await idbGet(IDB_STORE_BLOBS, 'lastSourceImage');
          let viewInfo = null;
          try {
            const raw = localStorage.getItem(LS_SOURCE_VIEW);
            viewInfo = raw ? JSON.parse(raw) : null;
          } catch(e) { viewInfo = null; }
          if (savedBlob && typeof savedBlob.dataURL === 'string' && savedBlob.dataURL.startsWith('data:image/')) {
            const img = await loadImageFromDataURL(savedBlob.dataURL);
            state.image = img;
            state.lastSourceDataURL = savedBlob.dataURL;
            if (viewInfo && typeof viewInfo === 'object' && typeof viewInfo.rotation === 'number') {
              state.rotation = viewInfo.rotation;
            }
            if ($('#collect-empty')) $('#collect-empty').style.display = 'none';
            if ($('#collect-editor')) $('#collect-editor').style.display = 'flex';
            resizeCollectCanvas();
            if (viewInfo && typeof viewInfo === 'object' && typeof viewInfo.scale === 'number') {
              let s = viewInfo.scale;
              let ox = viewInfo.offsetX;
              let oy = viewInfo.offsetY;
              if (!(s > 0 && s <= 10 && typeof ox === 'number' && typeof oy === 'number')) {
                fitImageToCanvas();
              } else {
                state.scale = s;
                state.offsetX = ox;
                state.offsetY = oy;
                drawCollectCanvas();
              }
            } else {
              fitImageToCanvas();
            }
          }
        } catch(e) {}
      })();
    }
  }
}
$$('.nav-tab').forEach(tab => {
  tab.addEventListener('click', () => switchPage(tab.dataset.page));
});

// ============================================================
//  1. 采集模块：上传 + 手势状态机 + 精准裁剪 + 确认弹窗
// ============================================================

const canvas = $('#collect-canvas');
const ctx = canvas.getContext('2d');
const canvasWrap = $('#canvas-wrap');
const selBox = $('#selection-box');
const modeHint = $('#mode-hint');

function resizeCollectCanvas() {
  const rect = canvasWrap.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  canvas.width = rect.width * dpr;
  canvas.height = rect.height * dpr;
  canvas.style.width = rect.width + 'px';
  canvas.style.height = rect.height + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  if (state.image) drawCollectCanvas();
}
window.addEventListener('resize', () => {
  resizeCollectCanvas();
  renderPaper();
});

// image effective dims (rotated logical size, in original pixels)
function getImageLogicalSize() {
  const r = ((state.rotation % 360) + 360) % 360;
  if (state.image) {
    const sw = state.image.naturalWidth;
    const sh = state.image.naturalHeight;
    if (r === 90 || r === 270) return { w: sh, h: sw };
    return { w: sw, h: sh };
  }
  return { w: 0, h: 0 };
}

function fitImageToCanvas() {
  if (!state.image) return;
  const rect = canvasWrap.getBoundingClientRect();
  const { w, h } = getImageLogicalSize();
  const scale = Math.min(rect.width / w, rect.height / h) * 0.95;
  state.scale = Math.max(0.1, Math.min(10, scale));
  state.offsetX = (rect.width - w * state.scale) / 2;
  state.offsetY = (rect.height - h * state.scale) / 2;
  drawCollectCanvas();
  saveSourceViewOnly();
}

function drawCollectCanvas() {
  const rect = canvasWrap.getBoundingClientRect();
  ctx.clearRect(0, 0, rect.width, rect.height);
  if (!state.image) return;
  const img = state.image;
  const { w: lw, h: lh } = getImageLogicalSize();
  const rotation = ((state.rotation % 360) + 360) % 360;
  // Pivot = 屏幕上"逻辑旋转后图像"的中心点
  const cx = state.offsetX + lw * state.scale / 2;
  const cy = state.offsetY + lh * state.scale / 2;
  const ow = img.naturalWidth, oh = img.naturalHeight;

  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(rotation * Math.PI / 180);
  ctx.scale(state.scale, state.scale);
  // Now in "scaled original pixel" space, centered at image center.
  // For 0° / 180° we draw with natural-width height (image natural w x h matches lw x lh).
  // For 90° / 270°, logical lw=oh, lh=ow; but after the rotate(90°), the rotated original image
  // naturally fills [ -oh/2..oh/2 , -ow/2..ow/2 ] which exactly matches logical bounds.
  // All four cases are the same drawImage call!
  ctx.drawImage(img, -ow / 2, -oh / 2);
  ctx.restore();

  // Draw selection highlight directly on canvas for clarity (also #selection-box DOM overlay)
  if (state.mode === 'crop' && state.selection) {
    const { sx, sy, cx, cy } = state.selection;
    const x = Math.min(sx, cx), y = Math.min(sy, cy);
    const w = Math.abs(cx - sx), h = Math.abs(cy - sy);
    ctx.save();
    ctx.fillStyle = 'rgba(139,37,34,0.12)';
    ctx.strokeStyle = '#8b2522';
    ctx.lineWidth = 2;
    ctx.setLineDash([6, 4]);
    ctx.fillRect(x, y, w, h);
    ctx.strokeRect(x, y, w, h);
    ctx.restore();
  }
}

// ===== Screen -> Original image pixel coordinate conversion =====
// Returns {x, y} in original (non-rotated) image natural pixel coordinates,
// clamped to image bounds.
function screenToImagePixel(sx, sy) {
  // Inverse of drawCollectCanvas transform.
  if (!state.image) return { x: 0, y: 0 };
  const rect = canvasWrap.getBoundingClientRect();
  const lsx = sx - rect.left;
  const lsy = sy - rect.top;
  const { w: lw, h: lh } = getImageLogicalSize();
  const cx = state.offsetX + lw * state.scale / 2;
  const cy = state.offsetY + lh * state.scale / 2;
  // Step 1: undo translate (cx,cy)
  let x = lsx - cx;
  let y = lsy - cy;
  // Step 2: undo rotation (rotate reverse)
  const rad = -state.rotation * Math.PI / 180;
  const rx = x * Math.cos(rad) - y * Math.sin(rad);
  const ry = x * Math.sin(rad) + y * Math.cos(rad);
  x = rx; y = ry;
  // Step 3: undo scale
  x /= state.scale;
  y /= state.scale;
  // Now (x,y) is in rotated logical coord centered at 0; translate to corner origin
  const ow = state.image.naturalWidth;
  const oh = state.image.naturalHeight;
  switch (((state.rotation % 360) + 360) % 360) {
    case 0:
      x += ow / 2;
      y += oh / 2;
      break;
    case 90: {
      // After 90 CW rotated drawing: the logical X axis corresponds to original image negative Y,
      // logical Y axis corresponds to original image positive X.
      // rotated_logical_xy = (x', y') ; origin of rotated logical at top-left = (0,0).
      // x' = x + lw/2, y' = y + lh/2  where lw=oh, lh=ow
      const xp = x + oh / 2;  // x'
      const yp = y + ow / 2;  // y'
      // Map back: original x = y', original y = (oh - 1) - x'
      x = yp;
      y = (oh - 1) - xp;
      break;
    }
    case 180: {
      x += ow / 2; y += oh / 2;
      x = (ow - 1) - x;
      y = (oh - 1) - y;
      break;
    }
    case 270: {
      const xp = x + oh / 2;
      const yp = y + ow / 2;
      // Rotated 270 CW (equivalent 90 CCW). Map back: original x = (ow-1) - y', original y = x'
      x = (ow - 1) - yp;
      y = xp;
      break;
    }
  }
  // Clamp
  x = Math.max(0, Math.min(ow - 1, x));
  y = Math.max(0, Math.min(oh - 1, y));
  return { x, y };
}

// ===== Gesture State Machine =====
const gesture = {
  pointers: new Map(),   // id -> {x,y}
  mode: 'idle',          // 'idle' | 'pan' | 'pinch' | 'select'
  startPinchDist: 0,
  startScale: 1,
  startMid: {x:0,y:0},
  startOffset: {x:0,y:0},
  startPanPt: {x:0,y:0},
  startSelect: null,
};

canvasWrap.style.touchAction = 'none';

function onPointerDown(e) {
  canvasWrap.setPointerCapture(e.pointerId);
  gesture.pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  const count = gesture.pointers.size;

  if (count === 1) {
    const p = [...gesture.pointers.values()][0];
    if (state.mode === 'crop') {
      gesture.mode = 'select';
      const rect = canvasWrap.getBoundingClientRect();
      gesture.startSelect = { sx: p.x - rect.left, sy: p.y - rect.top };
      state.selection = { sx: gesture.startSelect.sx, sy: gesture.startSelect.sy, cx: gesture.startSelect.sx, cy: gesture.startSelect.sy };
      updateSelectionBox();
    } else {
      gesture.mode = 'pan';
      gesture.startPanPt = { x: p.x, y: p.y };
      gesture.startOffset = { x: state.offsetX, y: state.offsetY };
    }
  } else if (count === 2) {
    // transition to pinch
    gesture.mode = 'pinch';
    const pts = [...gesture.pointers.values()];
    const dx = pts[0].x - pts[1].x;
    const dy = pts[0].y - pts[1].y;
    gesture.startPinchDist = Math.hypot(dx, dy) || 1;
    gesture.startScale = state.scale;
    gesture.startMid = { x: (pts[0].x + pts[1].x) / 2, y: (pts[0].y + pts[1].y) / 2 };
    gesture.startOffset = { x: state.offsetX, y: state.offsetY };
    state.selection = null;
    updateSelectionBox();
  }
}

function onPointerMove(e) {
  if (!gesture.pointers.has(e.pointerId)) return;
  gesture.pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

  if (gesture.mode === 'pan' && gesture.pointers.size === 1) {
    const p = gesture.pointers.get(e.pointerId);
    state.offsetX = gesture.startOffset.x + (p.x - gesture.startPanPt.x);
    state.offsetY = gesture.startOffset.y + (p.y - gesture.startPanPt.y);
    drawCollectCanvas();
  } else if (gesture.mode === 'pinch' && gesture.pointers.size === 2) {
    const pts = [...gesture.pointers.values()];
    const dx = pts[0].x - pts[1].x;
    const dy = pts[0].y - pts[1].y;
    const dist = Math.hypot(dx, dy) || 1;
    const ratio = dist / gesture.startPinchDist;
    const newScale = Math.max(0.1, Math.min(10, gesture.startScale * ratio));
    // Scale around startMid
    const rect = canvasWrap.getBoundingClientRect();
    const mx = gesture.startMid.x - rect.left;
    const my = gesture.startMid.y - rect.top;
    state.scale = newScale;
    // offset so that the image point under (mx,my) stays under it
    // (mx - startOffsetX) / startScale == (mx - newOffsetX) / newScale
    state.offsetX = mx - (mx - gesture.startOffset.x) * (newScale / gesture.startScale);
    state.offsetY = my - (my - gesture.startOffset.y) * (newScale / gesture.startScale);
    drawCollectCanvas();
  } else if (gesture.mode === 'select' && gesture.pointers.size === 1) {
    const p = gesture.pointers.get(e.pointerId);
    const rect = canvasWrap.getBoundingClientRect();
    state.selection.cx = p.x - rect.left;
    state.selection.cy = p.y - rect.top;
    updateSelectionBox();
    drawCollectCanvas();
  }
}

function onPointerUp(e) {
  gesture.pointers.delete(e.pointerId);
  if (gesture.pointers.size === 0) {
    if (gesture.mode === 'select' && state.selection) {
      const { sx, sy, cx, cy } = state.selection;
      const w = Math.abs(cx - sx);
      const h = Math.abs(cy - sy);
      if (w >= 10 && h >= 10) {
        performCrop(sx, sy, cx, cy);
      } else {
        state.selection = null;
        updateSelectionBox();
        drawCollectCanvas();
      }
    }
    // 手势结束时，持久化当前视图状态（缩放/平移/旋转）
    saveSourceViewOnly();
    gesture.mode = 'idle';
    state.selection = null;
    updateSelectionBox();
    drawCollectCanvas();
  } else if (gesture.pointers.size === 1 && gesture.mode === 'pinch') {
    // Downgrade to pan
    const p = [...gesture.pointers.values()][0];
    gesture.mode = 'pan';
    gesture.startPanPt = { x: p.x, y: p.y };
    gesture.startOffset = { x: state.offsetX, y: state.offsetY };
  }
}

canvasWrap.addEventListener('pointerdown', onPointerDown);
canvasWrap.addEventListener('pointermove', onPointerMove);
canvasWrap.addEventListener('pointerup', onPointerUp);
canvasWrap.addEventListener('pointercancel', onPointerUp);
canvasWrap.addEventListener('pointerleave', onPointerUp);

function updateSelectionBox() {
  if (!state.selection) { selBox.style.display = 'none'; return; }
  const { sx, sy, cx, cy } = state.selection;
  const x = Math.min(sx, cx), y = Math.min(sy, cy);
  const w = Math.abs(cx - sx), h = Math.abs(cy - sy);
  selBox.style.display = 'block';
  selBox.style.left = x + 'px';
  selBox.style.top = y + 'px';
  selBox.style.width = w + 'px';
  selBox.style.height = h + 'px';
}

// ===== Perform crop (核心：精准坐标转换 + 边界保护) =====
function performCrop(ssx, ssy, scx, scy) {
  if (!state.image) return;
  const rect = canvasWrap.getBoundingClientRect();
  // Convert 2 screen corners to original image pixels (absolute coords within wrap)
  const p1 = screenToImagePixel(rect.left + Math.min(ssx, scx), rect.top + Math.min(ssy, scy));
  const p2 = screenToImagePixel(rect.left + Math.max(ssx, scx), rect.top + Math.max(ssy, scy));
  // Now these may be in any order due to rotation mapping— just take pixel bounding box
  const ix1 = Math.max(0, Math.min(p1.x, p2.x));
  const iy1 = Math.max(0, Math.min(p1.y, p2.y));
  const ix2 = Math.min(state.image.naturalWidth - 1, Math.max(p1.x, p2.x));
  const iy2 = Math.min(state.image.naturalHeight - 1, Math.max(p1.y, p2.y));
  const sx = Math.floor(ix1);
  const sy = Math.floor(iy1);
  const sw = Math.max(1, Math.floor(ix2 - ix1));
  const sh = Math.max(1, Math.floor(iy2 - iy1));
  // W4 智能高清：裁剪时按真实像素出图，目标尺寸至少是 max(64, fontSize*2)——
  //   如果用户从高分辨率古籍图里选了很小一块（sw/sh < target），offscreen 先按 sw/sh 取真实像素再 upscale；
  //   如果选区本身就很大，则保留原始大尺寸不做额外放大，省 CPU。
  const minTarget = Math.max(64, state.createParams.fontSize * 2);
  // 真正输出尺寸 = 至少达到 minTarget（不够就放大 2× 整数倍），但不超过 4×（避免 8MB 单字图爆炸）
  let outW = sw, outH = sh;
  const currentMax = Math.max(sw, sh);
  if (currentMax < minTarget) {
    const k = Math.max(2, Math.ceil(minTarget / currentMax));
    const maxK = Math.floor(1024 / currentMax);   // 单字图最终像素不超 ~1024
    const useK = Math.max(1, Math.min(4, Math.min(k, maxK || 4)));
    outW = sw * useK;
    outH = sh * useK;
  }
  // Crop via offscreen canvas to real original pixels，再高质量插值放大到 outW/outH（pre-upscale 粗放大），
  //   真正的 Lanczos 细采样在入库时由 upscaleVariant 做
  const off = document.createElement('canvas');
  off.width = outW;
  off.height = outH;
  const octx = off.getContext('2d');
  octx.imageSmoothingEnabled = true;
  octx.imageSmoothingQuality = 'high';
  octx.drawImage(state.image, sx, sy, sw, sh, 0, 0, outW, outH);
  // W4：对"放大后的 canvas 内容"做一轮轻度锐化（在入库前还会再 upscaleVariant 一次）
  try {
    const lap = mildSharpenIfSmall(octx, outW, outH, /* threshold */ 512);
    if (lap) octx.putImageData(lap, 0, 0);
  } catch(_) {}
  const dataURL = off.toDataURL('image/png');
  // Preview in confirm modal
  const preview = $('#crop-preview-canvas');
  preview.width = 120; preview.height = 120;
  const pctx = preview.getContext('2d');
  pctx.clearRect(0, 0, 120, 120);
  // Draw fit
  const ratio = Math.min(116 / sw, 116 / sh);
  const dw = sw * ratio, dh = sh * ratio;
  pctx.drawImage(off, (120 - dw) / 2, (120 - dh) / 2, dw, dh);
  state.pendingCrop = { dataURL, width: sw, height: sh };
  $('#char-input').value = '';
  openConfirmModal();
}

  // W4：新采集入库前先做一次"智能高清处理"（超分 + unsharp mask + 对比度），
  //   把结果压入库（不压原图，减少后续每次都 upscale 的 CPU 消耗）
  let src = state.pendingCrop.dataURL;

    if (hd && typeof hd === 'string' && hd.startsWith('data:image/')) src = hd;
  } catch(_) {}
  state.library[ch].push(src);
  // W3：把这个字提升到字库最顶部（新采集的字立即首屏可见）
  promoteCharToTop(ch);
  await saveLibrary();
  showToast(`「${ch}」已加入字库（高清处理完成）`);
  closeConfirmModal();
});

(function bindLibSortPill(){

function getLibSortMode() {

// 根据当前排序模式，得到字库的展示顺序（数组，chars 列表）
function getLibraryDisplayOrder() {
  const baseOrder = normalizeLibraryChars(); // 默认 addedTs 倒序（chars 显序就是倒序实现）
  const sort = getLibSortMode();
  if (sort === 'pinyin') {
    return baseOrder.slice().sort(cmpPinyin);
  }
  return baseOrder;
}

function renderLibrary() {
  const kw = ($('#lib-search').value || '').trim();
  const grid = $('#char-grid');
  grid.innerHTML = '';
  // 字库展示排序：默认采集时间倒序（state.chars 显序），可选拼音首字母
  const order = getLibraryDisplayOrder();
  const chars = kw
    ? order.filter(c => !kw || c.includes(kw))
    : order;
  let totalVariants = 0;
  order.forEach(ch => totalVariants += (state.library[ch] ? state.library[ch].length : 0));
  $('#lib-count').textContent = `字库共 ${order.length} 字 · ${totalVariants} 变体`;
  $('#lib-empty').style.display = chars.length ? 'none' : 'block';
  const frag = document.createDocumentFragment();
  chars.forEach(ch => {
    const variants = state.library[ch];
    const card = document.createElement('div');
    card.className = 'char-card';
    card.innerHTML = `
      <div class="char-head">
        <span class="char-name">${escapeHtml(ch)}</span>
        <span class="char-count">${variants.length} 变体</span>
        <button class="del-char" data-action="del-char" data-char="${escapeAttr(ch)}" title="删除该字及所有变体">×</button>
      </div>
      <div class="variants-scroll">
        ${variants.map((v, i) => `
          <div class="variant">
            <button class="del-variant" data-action="del-variant" data-char="${escapeAttr(ch)}" data-index="${i}" title="删除该变体">×</button>
            <img src="${v}" alt="${escapeAttr(ch)}" />
          </div>
        `).join('')}
      </div>
    `;
    frag.appendChild(card);
  });
  grid.appendChild(frag);
}

$('#char-grid').addEventListener('click', (e) => {

  if (action === 'del-char') {

      delete state.library[ch];
      saveLibrary();
      renderLibrary();
      showToast(`已删除「${ch}」`);
    }
  } else if (action === 'del-variant') {

      if (state.library[ch].length === 0) delete state.library[ch];
      saveLibrary();
      renderLibrary();
    }
  }
});

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function escapeAttr(s) { return escapeHtml(s); }

$('#lib-import-file').addEventListener('change', (e) => {
  const f = e.target.files && e.target.files[0];
  if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const obj = JSON.parse(r.result);
      const lib = obj.library || obj;
      let added = 0, merged = 0;
      const newChars = [];
      // 先按 JSON 给出的顺序遍历（通常 = 用户当年导出时的 chars 顺序）
      Object.keys(lib).forEach(ch => {
        if (!Array.isArray(lib[ch])) return;
        if (!state.library[ch]) { state.library[ch] = []; added++; }
        const before = state.library[ch].length;
        lib[ch].forEach(v => {
          if (typeof v === 'string' && v.startsWith('data:image/')) state.library[ch].push(v);
        });
        merged += state.library[ch].length - before;
        // W3：本次"有新内容加入"的字，按遍历顺序加入 newChars 头，导入完成后批量 promote 到顶部
        //   （新增字优先；合并变体的旧字也适度置顶）
        if (state.library[ch].length - before > 0) newChars.push(ch);
      });
      // W3：把"新增/合并过变体的字符"按导入时顺序整体 promote 到字库最上
      if (newChars.length) {
        normalizeLibraryChars();
        for (let i = newChars.length - 1; i >= 0; i--) promoteCharToTop(newChars[i]);
      }
      saveLibrary();
      renderLibrary();
      showToast(`导入完成：新增 ${added} 字，合并 ${merged} 变体`);
    } catch (err) {
      showToast('导入失败：文件格式不正确');
    } finally {
      $('#lib-import-file').value = '';
    }
  };
  r.readAsText(f, 'utf-8');
});

function bindRange(id, key, suffix = 'px', transform = v => +v) {
  const el = $('#' + id);
  const update = () => {
    el.style.setProperty('--val', ((el.value - el.min) / (el.max - el.min) * 100) + '%');
    const vEl = $('#' + id + '-v');
    if (vEl) vEl.textContent = el.value + suffix;

  paperBg.className = '';
  const bg = state.createParams.bg;
  // 清除旧内联背景
  paperBg.style.backgroundImage = '';
  paperBg.style.backgroundSize = '';
  paperBg.style.backgroundPosition = '';
  // 移除旧 img（仅 custom 会注入 .paper-bg-img；xuan / xuanwhite 走 CSS 自绘）
  const oldImgs = paperBg.querySelectorAll('img.paper-bg-img');
  oldImgs.forEach(x => x.remove());

  let realBg = bg;
  // 同步上传背景按钮提示文案
  const updateHint = (customMode) => {
    const hint = $('#bg-custom-hint');
    if (!hint) return;
    hint.textContent = (customMode || state.userBackgroundDataURL) ? '点此更换' : '点此选图';
  };

  if (bg === 'xuan') {
    realBg = 'xuan';
    updateHint(false);
  } else if (bg === 'xuanwhite') {
    realBg = 'xuanwhite';
    updateHint(false);
  } else if (bg === 'custom') {
    realBg = 'custom';
    if (state.userBackgroundDataURL) {
      const img = document.createElement('img');
      img.className = 'paper-bg-img';
      img.alt = '自定义背景';

      paperBg.appendChild(img);

// ===== 智能高清处理（裁剪字的变体图）=====
// 目标：用户从古籍图中裁剪的小块字常常只有 20~50px，在 32~60px 的创作排版里会糊；
// 流程：preload → 测 naturalSize —— 比目标尺寸小时，canvas 做 Lanczos3 整数倍重采样到 2×，
//        再做 1% 黑/白点裁剪的线性对比度拉伸，最后一轮 unsharp mask (3×3 Laplacian)。
// 结果缓存在内存 state._upscaleMap（key = dataURL 前 64 字符 + 尺寸哈希），避免每帧排版重复跑 CPU。
(() => {
  // 内存缓存 key → { outDataURL, naturalW, naturalH, targetFont }
  const UPSCALE_LRU_CACHE_MAX = 800;
  const lruMap = (() => {
    const map = new Map(); // key -> { val, at }
    return {
      get(k){ const r = map.get(k); if (r) { r.at = Date.now(); return r.val; } return undefined; },
      set(k, v){
        if (map.size >= UPSCALE_LRU_CACHE_MAX) {
          let oldestKey = null, oldestAt = Infinity;
          for (const [kk, vv] of map) { if (vv.at < oldestAt) { oldestAt = vv.at; oldestKey = kk; } }
          if (oldestKey != null) map.delete(oldestKey);
        }
        map.set(k, { val: v, at: Date.now() });
      }
    };
  })();

  // 3×3 拉普拉斯锐化（边缘增强，适合古籍小字）
  function applyLaplacian(idata, amount = 0.35) {
    const w = idata.width, h = idata.height;
    const src = idata.data;
    const out = new Uint8ClampedArray(src);
    const a = amount;
    const c = 1 + 4 * a; // center weight
    // 系数：center c, up/down/left/right -a；只处理亮度通道（灰度）— 古籍黑字近似单通道，省一半 CPU
    const gray = (r, g, b) => 0.299 * r + 0.587 * g + 0.114 * b;
    for (let y = 0; y < h; y++) {
      for (let x = 0; x < w; x++) {
        const i = (y * w + x) * 4;
        const cy = y > 0 ? i - w * 4 : i;
        const fy = y < h - 1 ? i + w * 4 : i;
        const cx = x > 0 ? i - 4 : i;
        const fx = x < w - 1 ? i + 4 : i;
        const midG = gray(src[i], src[i+1], src[i+2]);
        const nG = (c * midG
          - a * gray(src[cx], src[cx+1], src[cx+2])
          - a * gray(src[fx], src[fx+1], src[fx+2])
          - a * gray(src[cy], src[cy+1], src[cy+2])
          - a * gray(src[fy], src[fy+1], src[fy+2]));
        if (Math.abs(nG - midG) < 0.5) continue; // 平坦区域不做，防噪
        const ratio = midG === 0 ? 1 : (nG / midG);
        const clamp = (v) => (v < 0 ? 0 : (v > 255 ? 255 : v));
        out[i]   = clamp(Math.round(src[i]   * ratio));
        out[i+1] = clamp(Math.round(src[i+1] * ratio));
        out[i+2] = clamp(Math.round(src[i+2] * ratio));
      }
    }
    return new ImageData(out, w, h);
  }

  // 对比度：裁掉 1% 最亮/最暗像素（去掉古籍纸黄偏的脏白与微黑点），线性映射回 0~255
  function linearStretch(idata, percentCut = 0.01) {
    const d = idata.data, w = idata.width, h = idata.height;
    // 走灰度直方图
    const hist = new Uint32Array(256);
    for (let i = 0; i < d.length; i += 4) {
      const g = (d[i] * 77 + d[i+1] * 150 + d[i+2] * 29) >> 8;
      hist[g]++;
    }
    const total = w * h;
    let acc = 0, low = 0, high = 255;
    const loThr = Math.floor(total * percentCut);
    const hiThr = total - loThr - 1;
    for (let g = 0; g < 256; g++) {
      const prev = acc; acc += hist[g];
      if (prev <= loThr && acc > loThr) low = g;
      if (prev <= hiThr && acc > hiThr) { high = g; break; }
    }
    if (high - low < 12) return idata;  // 对比已经很好，跳过
    const scale = 255 / (high - low);
    const out = new Uint8ClampedArray(d);
    const clamp = (v) => (v < 0 ? 0 : (v > 255 ? 255 : v));
    for (let i = 0; i < d.length; i += 4) {
      out[i]   = clamp(Math.round((d[i]   - low) * scale));
      out[i+1] = clamp(Math.round((d[i+1] - low) * scale));
      out[i+2] = clamp(Math.round((d[i+2] - low) * scale));
    }
    return new ImageData(out, w, h);
  }

  // Lanczos3 (a=3) 1D 核
  function lanczos3(x) {
    if (x < -3) return 0; if (x > 3) return 0;
    if (x === 0) return 1;
    const pi = Math.PI;
    const ax = Math.abs(x);
    return (3 * Math.sin(pi * ax) * Math.sin(pi * ax / 3)) / (pi * pi * ax * ax);
  }

  // 双步 Lanczos3 先列后行：把 src (sw,sh) 整数倍放大 k 倍 → 返回新 ImageData
  function lanczos3Scale(src, sw, sh, k) {
    const dw = sw * k, dh = sh * k;
    // Step 1: 水平放大 (sw,sh) → (dw,sh)；仅对行方向做 2D separable 省 CPU
    const tmp = new Uint8ClampedArray(dw * sh * 4);
    for (let y = 0; y < sh; y++) {
      const row = y * sw * 4;
      const row2 = y * dw * 4;
      for (let x = 0; x < dw; x++) {
        // source center = (x + 0.5)/k - 0.5
        const sx = (x + 0.5) / k - 0.5;
        const x0 = Math.floor(sx - 3) + 1;
        const x1 = Math.floor(sx + 3);
        let r = 0, g = 0, b = 0, a = 0, wsum = 0;
        for (let xi = x0; xi <= x1; xi++) {
          const xc = Math.max(0, Math.min(sw - 1, xi));
          const kk = lanczos3(sx - xi);
          const p = row + xc * 4;
          r += src[p] * kk; g += src[p+1] * kk; b += src[p+2] * kk; a += src[p+3] * kk; wsum += kk;
        }
        const p = row2 + x * 4;
        const ws = wsum === 0 ? 1 : wsum;
        tmp[p]   = r/wsum|0;
        tmp[p+1] = g/wsum|0;
        tmp[p+2] = b/wsum|0;
        tmp[p+3] = a/wsum|0;
      }
    }
    // Step 2: 垂直放大 (dw,sh) → (dw,dh)
    const out = new Uint8ClampedArray(dw * dh * 4);
    for (let x = 0; x < dw; x++) {
      const col0 = x * 4;
      for (let y = 0; y < dh; y++) {
        const sy = (y + 0.5) / k - 0.5;
        const y0 = Math.floor(sy - 3) + 1;
        const y1 = Math.floor(sy + 3);
        let r = 0, g = 0, b = 0, a = 0, wsum = 0;
        for (let yi = y0; yi <= y1; yi++) {
          const yc = Math.max(0, Math.min(sh - 1, yi));
          const kk = lanczos3(sy - yi);
          const p = yc * dw * 4 + col0;
          r += tmp[p] * kk; g += tmp[p+1] * kk; b += tmp[p+2] * kk; a += tmp[p+3] * kk; wsum += kk;
        }
        const p = y * dw * 4 + col0;
        const ws = wsum === 0 ? 1 : wsum;
        out[p]   = r/wsum|0;
        out[p+1] = g/wsum|0;
        out[p+2] = b/wsum|0;
        out[p+3] = a/wsum|0;
      }
    }
    return new ImageData(out, dw, dh);
  }

  // 裁剪成功后 / variant 渲染时做轻度锐化：只有小尺寸 (<512px max 边) 才做，避免大图画蛇添足
  window.mildSharpenIfSmall = function(ctx, w, h, maxSide = 512) {
    if (Math.max(w, h) > maxSide) return null;
    try {
      const id = ctx.getImageData(0, 0, w, h);
      return applyLaplacian(id, 0.25);
    } catch (e) { return null; }
  };

  // 主入口：根据"排版字号 fontSize"决定要不要超分；不需要就原封返回
  window.upscaleVariant = async function(srcDataURL, fontSizePx = 32) {
    if (!srcDataURL || typeof srcDataURL !== 'string' || !srcDataURL.startsWith('data:image/')) return srcDataURL;
    // 解码 src，拿到真实 natural 尺寸
    let img;
    try {
      const im = new Image();
      img = await new Promise((resolve, reject) => {
        im.onload = () => resolve(im);
        im.onerror = () => reject(new Error('img decode'));
        im.src = srcDataURL;
      });
    } catch(_) { return srcDataURL; }
    const nw = img.naturalWidth || 1, nh = img.naturalHeight || 1;
    const target = Math.max(40, Math.round(1.6 * (Number(fontSizePx) || 32))); // 目标 ≈ 字号的 1.6×（DPR 2 高清排版下限）
    // 短边达到目标 ≥ 目标 1.1× 就不超分，直接过（防止过度锐化）
    const shortEdge = Math.min(nw, nh);
    if (shortEdge >= target * 1.1) return srcDataURL;
    // LRU cache：key = dataURL 前缀（dataURL 前 60 字节几乎已唯一）+ 字号
    const key = String(srcDataURL).slice(0, 72) + '|' + target;
    const cached = lruMap.get(key);
    if (cached) return cached;

    // 整数倍放大：k = ceil(target / shortEdge)，限制 3 倍上限 & 单字 ≤1024
    let k = Math.max(1, Math.ceil(target / shortEdge));
    k = Math.min(3, k, Math.max(1, Math.floor(1024 / Math.max(nw, nh))));
    if (k <= 1) return srcDataURL;
    const dw = nw * k, dh = nh * k;
    // Step A：drawImage 到临时 canvas（只是"占位"，保证尺寸），之后立刻 getImageData
    const cv = document.createElement('canvas');
    cv.width = nw; cv.height = nh;
    const c = cv.getContext('2d');
    c.drawImage(img, 0, 0, nw, nh);
    let id;
    try { id = c.getImageData(0, 0, nw, nh); } catch(_) { return srcDataURL; }
    // Step B：Lanczos3 k× 超分
    const up = lanczos3Scale(id.data, nw, nh, k);
    // Step C：线性对比度拉伸（去纸黄脏白+让黑字更黑）
    const stretched = linearStretch(new ImageData(up, dw, dh), 0.008);
    // Step D：Laplacian 锐化 0.30（宣纸字不是太毛，适度锐化）
    const sharp = applyLaplacian(stretched, 0.30);

    // 写出最终 PNG dataURL
    const outCv = document.createElement('canvas');
    outCv.width = dw; outCv.height = dh;
    const octx = outCv.getContext('2d');
    octx.putImageData(sharp, 0, 0);
    let outURL;
    try {
      outURL = outCv.toDataURL('image/png');
    } catch(_) { return srcDataURL; }
    if (!outURL || !outURL.startsWith('data:image/')) return srcDataURL;
    lruMap.set(key, outURL);
    return outURL;
  };
})();

// ===== 字图获取（字库中无对应字时，返回 null 由楷体兜底）=====
function getCharVariantImg(ch, seedIndex = 0) {
  const vars = state.library[ch];
  if (!vars || vars.length === 0) return null;
  return vars[seedIndex % vars.length];
}
// 预加载所有会用到的字图（确保导出 Canvas 不会空白）
function preloadImages(urls) {
  return Promise.all(urls.map(url => new Promise((resolve) => {
    const im = new Image();
    im.onload = im.onerror = () => resolve(im);
    im.src = url;
  })));
}

// ===== 排版计算 =====
// returns: array of {ch, x, y, w, h, imgUrl|null, textIdx}
// textIdx = 该字在 createParams.text 里的 UTF-16 下标
function layoutCharacters(pw, ph, params) {
  const { text, layout, fontSize, letterSpace, lineSpace, bg } = params;
  // 根据背景预留金边/白边安全距离（米黄 12.5%、米白 12%、custom 最小）
  const side = Math.min(pw, ph);
  let basePad;
  if (bg === 'xuan')       basePad = Math.max(side * 0.125, fontSize * 0.60 + 10);
  else if (bg === 'xuanwhite') basePad = Math.max(side * 0.12,  fontSize * 0.60 +  8);
  else                       basePad = Math.max(14,            fontSize * 0.60 +  4);
  const padding = Math.max(12, Math.floor(basePad));
  const usableW = Math.max(1, pw - padding * 2);
  const usableH = Math.max(1, ph - padding * 2);
  const lines = text.split(/\r?\n/);

  const chW = fontSize;
  const chH = fontSize;
  const result = [];
  let globalTextIdx = 0;

  if (layout === 'h') {
    let cursorX = 0, cursorY = 0;
    lines.forEach(line => {
      const chars = Array.from(line);
      chars.forEach((ch, i) => {
        const baseX = padding + cursorX;
        const baseY = padding + cursorY;
        result.push({
          ch,
          textIdx: globalTextIdx,
          x: baseX, y: baseY, w: chW, h: chH,
          imgUrl: getCharVariantImg(ch, i)
        });
        cursorX += chW + letterSpace;
        globalTextIdx += ch.length; // UTF-16 代理对按实际长度累加
      });
      cursorX = 0;
      cursorY += chH + lineSpace;
      globalTextIdx += 1;
    });
  } else {
    // 竖排：从右向左；每列从上到下；换行 = 向左一列
    const columns = lines.length ? lines : [''];
    let cursorColRight = usableW - chW; // 从最右列开始（相对 padding 内）
    columns.forEach(col => {
      const chars = Array.from(col);
      let cursorY = 0;
      chars.forEach((ch, i) => {
        const baseX = padding + cursorColRight;
        const baseY = padding + cursorY;
        result.push({
          ch,
          textIdx: globalTextIdx,
          x: baseX, y: baseY, w: chW, h: chH,
          imgUrl: getCharVariantImg(ch, i)
        });
        cursorY += chH + lineSpace;
        globalTextIdx += ch.length;
      });
      cursorColRight -= (chW + letterSpace);
      globalTextIdx += 1; // 换行符占位
    });
  }
  return result;
}

// ===== DOM 渲染 paper（预览）=====
function renderPaper() {
  const rect = paper.getBoundingClientRect();
  const pw = rect.width, ph = rect.height;
  const items = layoutCharacters(pw, ph, state.createParams);
  paperContent.innerHTML = '';
  // 自定背景图的文字颜色不变（由用户保证图的对比度），但 xuan/xuanwhite 都默认墨色
  const royal = state.createParams.bg === 'royal';
  let maxRight = 0, maxBottom = 0;
  items.forEach(item => {
    const el = document.createElement('div');
    el.className = 'paper-char' + (royal ? ' royal-text' : '');
    el.style.left = item.x + 'px';
    el.style.top = item.y + 'px';
    el.style.width = item.w + 'px';
    el.style.height = item.h + 'px';
    // 记录供下一层调试/扩展（无逐字微调，保留 textIdx 便于日志对齐）
    el.dataset.textIdx = String(item.textIdx);
    el.dataset.ch = item.ch;
    if (item.imgUrl) {
      const img = document.createElement('img');
      img.src = item.imgUrl;
      img.alt = item.ch;
      img.style.pointerEvents = 'none';
      el.appendChild(img);
    } else {
      el.style.fontSize = item.h + 'px';
      el.style.fontFamily = '"KaiTi", "STKaiti", "楷体", "Noto Serif SC", serif';
      el.style.fontWeight = '700';
      el.style.lineHeight = '1';
      el.textContent = item.ch;
    }
    paperContent.appendChild(el);
    maxRight = Math.max(maxRight, item.x + item.w);
    maxBottom = Math.max(maxBottom, item.y + item.h);
  });
  // 判断文案是否超出宣纸可见区：超出则显示展开/下拉按钮
  const overflowY = maxBottom > (ph - 40 * 2) + 4; // padding *2 以内留 4px 容差
  const overflowX = maxRight > (pw - 40 * 2) + 4;
  const tooLong = !!(state.createParams.text) && (overflowY || overflowX || state.createParams.text.length > 40);
  const btn = $('#paper-toggle');
  if (btn) btn.classList.toggle('show', !!tooLong);
  updatePaperToggleLabel();
}

function updatePaperToggle() {
  const btn = $('#paper-toggle');
  if (!btn) return;
  const expanded = paper.classList.contains('expanded');
  const ic = btn.querySelector('.paper-toggle-ic');
  if (ic) ic.textContent = expanded ? '⬆️' : '⬇️';
  updatePaperToggleLabel();
}
function updatePaperToggleLabel() {
  const btn = $('#paper-toggle');
  if (!btn) return;
  const txt = btn.querySelector('.paper-toggle-text');
  if (txt) txt.textContent = paper.classList.contains('expanded') ? '收起' : '展开';
}

// ===== 保存作品 + 下载高清（Canvas 2x DPR）=====
async function renderToHiResCanvas() {
  const rect = paper.getBoundingClientRect();
  const baseW = rect.width, baseH = rect.height;
  const DPR = 2;
  const out = document.createElement('canvas');
  out.width = Math.round(baseW * DPR);
  out.height = Math.round(baseH * DPR);
  const c = out.getContext('2d');
  c.scale(DPR, DPR);
  c.imageSmoothingQuality = 'high';

  // 预加载：单字图 + 自定义背景图
  const items = layoutCharacters(baseW, baseH, state.createParams);
  const imgUrls = items.map(i => i.imgUrl).filter(Boolean);
  const bg = state.createParams.bg;
  let userBgImg = null;
  if (bg === 'custom' && state.userBackgroundDataURL) {
    userBgImg = (await preloadImages([state.userBackgroundDataURL]))[0];
  }

  // Step 1: Draw background
  await drawBackground(c, baseW, baseH, bg, userBgImg);

  // Preload char images (确保不会空白)
  const imgMap = new Map();
  if (imgUrls.length) {
    const loaded = await preloadImages(imgUrls);
    imgUrls.forEach((u, i) => imgMap.set(u, loaded[i]));
  }

  // Step 3: Draw each character
  const royal = bg === 'royal';
  items.forEach(item => {
    if (item.imgUrl && imgMap.has(item.imgUrl) && imgMap.get(item.imgUrl).complete && imgMap.get(item.imgUrl).naturalWidth > 0) {
      const img = imgMap.get(item.imgUrl);
      // 保持透明单字图
      c.drawImage(img, item.x, item.y, item.w, item.h);
    } else {
      // 楷体兜底
      c.save();
      c.font = `700 ${item.h}px "KaiTi","STKaiti","楷体","Noto Serif SC","Source Han Serif SC",serif`;
      c.fillStyle = royal ? '#f2d47a' : '#2c241b';
      c.textBaseline = 'top';
      c.textAlign = 'left';
      // 水平+垂直居中 (近似)
      const metrics = c.measureText(item.ch);
      const w = metrics.width;
      c.fillText(item.ch, item.x + (item.w - w) / 2, item.y + (item.h - item.h * 0.92) / 2 - item.h * 0.04);
      c.restore();
    }
  });
  return out;
}

// 同步绘制：米黄/米白都是 Canvas 自绘，无需 await 内置图；custom 仍然是异步（等待用户图 decode）
async function drawBackground(c, w, h, bg, userBgImg) {
  c.save();

  // object-fit: cover 工具（仅 custom 背景使用）
  const drawCover = (img) => {
    if (!img || !img.complete || !img.naturalWidth) return false;
    const iw = img.naturalWidth, ih = img.naturalHeight;
    const r = Math.max(w / iw, h / ih);
    const dw = iw * r, dh = ih * r;
    const dx = (w - dw) / 2, dy = (h - dh) / 2;
    c.drawImage(img, dx, dy, dw, dh);
    return true;
  };

  if (bg === 'xuan') {
    // ==== 宣纸·米黄（生宣 · 御制祥云金框版，与 CSS 同算法）====
    // 1) 米黄底色（多层渐变晕染）
    const base = c.createLinearGradient(0, 0, w, h);
    base.addColorStop(0, '#faecc6');
    base.addColorStop(0.48, '#f4dca3');
    base.addColorStop(1, '#eccb83');
    c.fillStyle = base; c.fillRect(0, 0, w, h);
    const g1 = c.createRadialGradient(w*0.14, h*0.12, Math.min(w,h)*0.04, w*0.14, h*0.12, Math.max(w,h)*0.6);
    g1.addColorStop(0, 'rgba(222,178,108,0.42)');
    g1.addColorStop(1, 'rgba(222,178,108,0)');
    c.fillStyle = g1; c.fillRect(0,0,w,h);
    const g2 = c.createRadialGradient(w*0.86, h*0.88, Math.min(w,h)*0.04, w*0.86, h*0.88, Math.max(w,h)*0.6);
    g2.addColorStop(0, 'rgba(206,152,82,0.32)');
    g2.addColorStop(1, 'rgba(206,152,82,0)');
    c.fillStyle = g2; c.fillRect(0,0,w,h);
    const g3 = c.createRadialGradient(w*0.86, h*0.10, Math.min(w,h)*0.05, w*0.86, h*0.10, Math.max(w,h)*0.55);
    g3.addColorStop(0, 'rgba(216,166,90,0.22)');
    g3.addColorStop(1, 'rgba(216,166,90,0)');
    c.fillStyle = g3; c.fillRect(0,0,w,h);
    const g4 = c.createRadialGradient(w*0.14, h*0.90, Math.min(w,h)*0.05, w*0.14, h*0.90, Math.max(w,h)*0.55);
    g4.addColorStop(0, 'rgba(216,166,90,0.22)');
    g4.addColorStop(1, 'rgba(216,166,90,0)');
    c.fillStyle = g4; c.fillRect(0,0,w,h);
    const g5 = c.createRadialGradient(w*0.5, h*0.5, Math.min(w,h)*0.1, w*0.5, h*0.5, Math.max(w,h)*0.7);
    g5.addColorStop(0, 'rgba(255,244,214,0.85)');
    g5.addColorStop(1, 'rgba(255,244,214,0)');
    c.fillStyle = g5; c.fillRect(0,0,w,h);

    // 2) 帘纹
    c.save();
    c.globalAlpha = 0.7;
    c.fillStyle = 'rgba(140,100,45,0.06)';
    for (let x = 0; x < w; x += 6) c.fillRect(x, 0, 1, h);
    c.restore();

    // 3) 纤维暗斑（确定性散点）
    drawRiceSpecks(c, w, h, 0.92, 'rgba(135,90,30,0.20)', 'rgba(155,105,45,0.12)');

    // 4) 四角祥云（金描），按尺寸自适应缩放
    drawCloudPattern(c, w, h, Math.max(w, h), 'xuan');

    // 5) 双层金边（外细 内粗）
    drawDoubleGoldFrame(c, w, h);

    // 6) 撒金（小圆点 + 不规则碎金）
    drawGoldSplatter(c, w, h);

  } else if (bg === 'xuanwhite') {
    // ==== 宣纸·米白（熟宣 · 祥云冰裂版）====
    // 1) 米白底色
    const base = c.createLinearGradient(0, 0, w, h);
    base.addColorStop(0, '#faf8f1');
    base.addColorStop(0.5, '#f4efe1');
    base.addColorStop(1, '#ece4cd');
    c.fillStyle = base; c.fillRect(0, 0, w, h);
    const g1 = c.createRadialGradient(w*0.16, h*0.10, Math.min(w,h)*0.05, w*0.16, h*0.10, Math.max(w,h)*0.55);
    g1.addColorStop(0, 'rgba(230,214,176,0.22)');
    g1.addColorStop(1, 'rgba(230,214,176,0)');
    c.fillStyle = g1; c.fillRect(0,0,w,h);
    const g2 = c.createRadialGradient(w*0.84, h*0.90, Math.min(w,h)*0.05, w*0.84, h*0.90, Math.max(w,h)*0.55);
    g2.addColorStop(0, 'rgba(220,200,160,0.20)');
    g2.addColorStop(1, 'rgba(220,200,160,0)');
    c.fillStyle = g2; c.fillRect(0,0,w,h);
    const g5 = c.createRadialGradient(w*0.5, h*0.5, Math.min(w,h)*0.1, w*0.5, h*0.5, Math.max(w,h)*0.7);
    g5.addColorStop(0, 'rgba(255,255,248,0.85)');
    g5.addColorStop(1, 'rgba(255,255,248,0)');
    c.fillStyle = g5; c.fillRect(0,0,w,h);

    // 2) 帘纹
    c.save();
    c.globalAlpha = 0.55;
    c.fillStyle = 'rgba(180,160,120,0.045)';
    for (let x = 0; x < w; x += 7) c.fillRect(x, 0, 1, h);
    c.restore();

    // 3) 纤维散点
    drawRiceSpecks(c, w, h, 0.6, 'rgba(150,120,70,0.14)', 'rgba(160,130,75,0.08)');

    // 4) 四角淡祥云 + 全幅冰裂纹
    drawCloudPattern(c, w, h, Math.max(w,h), 'xuanwhite');
    drawIceCracks(c, w, h);

    // 5) 米白双描边框
    drawDoubleWhiteFrame(c, w, h);

  } else if (bg === 'custom') {
    // 用户上传背景图：优先传入已预加载的 userBgImg，否则回退米黄
    if (userBgImg && userBgImg.complete && userBgImg.naturalWidth > 0) {
      drawCover(userBgImg);
      // 极薄米白遮罩，和 DOM 预览视觉统一
      c.save();
      c.globalAlpha = 0.10;
      const ov = c.createLinearGradient(0, 0, w, h);
      ov.addColorStop(0, 'rgba(255,252,240,0.75)');
      ov.addColorStop(1, 'rgba(255,252,240,0)');
      c.fillStyle = ov; c.fillRect(0,0,w,h);
      c.restore();
    } else {
      // 兜底：回退米黄宣纸
      c.restore();
      return drawBackground(c, w, h, 'xuan', null);
    }
  }

  // 边缘阴影（纸感）
  c.save();
  c.globalCompositeOperation = 'multiply';
  const eg = c.createRadialGradient(w/2, h/2, Math.min(w,h)*0.4, w/2, h/2, Math.max(w,h)*0.75);
  eg.addColorStop(0, 'rgba(0,0,0,0)');
  eg.addColorStop(1, 'rgba(44,36,27,0.22)');
  c.fillStyle = eg; c.fillRect(0, 0, w, h);
  c.restore();
  c.restore();
}

// （回退：参考图版本的 getBuiltinBgImg / 预解码已删除；xuan/xuanwhite 现在是代码自绘）

// —— 祥云图（仿 SVG quadratic paths 画到 canvas） ——
function drawCloudPattern(c, w, h, base, type) {
  const isXuan = type === 'xuan';
  // 线条色 & 粗细
  const darkStroke = isXuan ? '#9c7118' : 'rgba(191,167,116,0.95)';
  const stroke = isXuan ? '#c7992a' : 'rgba(191,167,116,0.75)';
  const lightStroke = isXuan ? 'rgba(199,153,42,0.72)' : 'rgba(191,167,116,0.55)';
  const faintStroke = isXuan ? 'rgba(199,153,42,0.52)' : 'rgba(191,167,116,0.4)';

  // 祥云 scale：相对画布基准尺寸。SVG 设计宽 260（视口 600 宽）。
  const scale = Math.max(0.45, Math.min(w, h) / 600) * 1.05;

  // 单位祥云：按 quad control 数组绘制，(cx,cy,dx,dy) = 绘制基准点
  function cloud(cx, cy, weight, strokeStyle, lineMult){
    c.save();
    c.translate(cx, cy);
    c.scale(scale * weight, scale * weight);
    c.strokeStyle = strokeStyle;
    c.lineWidth = (lineMult || 1) * (isXuan ? 2 : 1.25);
    c.lineCap = 'round'; c.lineJoin = 'round';
    // 祥云主朵（SVG path 拆分段：M→Q→Q...→Z 的逻辑路径）
    c.beginPath();
    c.moveTo(0,0);
    c.quadraticCurveTo(16,-18, 40,-10);
    c.quadraticCurveTo(50,-6, 48, 8);
    c.quadraticCurveTo(46, 18, 34, 22);
    c.quadraticCurveTo(20, 25,  8, 18);
    c.moveTo(20, 32);
    c.quadraticCurveTo(32, 46, 16, 52);
    c.quadraticCurveTo(2,  58, -12, 46);
    c.quadraticCurveTo(-16, 42, -10, 38);
    c.moveTo(-24, 36);
    c.quadraticCurveTo(-38, 34, -36, 20);
    c.quadraticCurveTo(-35, 11, -26, 8);
    c.moveTo(-32, 0);
    c.quadraticCurveTo(-36, -14, -20, -18);
    c.stroke();
    c.restore();
  }

  function cloudSmall(cx, cy, weight, strokeStyle){
    c.save();
    c.translate(cx, cy);
    c.scale(scale * weight, scale * weight);
    c.strokeStyle = strokeStyle;
    c.lineWidth = (isXuan ? 1.6 : 1.1);
    c.lineCap = 'round'; c.lineJoin = 'round';
    c.beginPath();
    c.moveTo(0,0);
    c.quadraticCurveTo(10,-10, 26,-4);
    c.quadraticCurveTo(36,0, 32,12);
    c.quadraticCurveTo(29,20, 14,22);
    c.quadraticCurveTo(0,22, -6,12);
    c.moveTo(6,22);
    c.quadraticCurveTo(18,32, 0,34);
    c.quadraticCurveTo(-10,34, -10,22);
    c.stroke();
    c.restore();
  }

  // 右上角主祥云
  const margin = Math.min(w,h) * 0.035;
  cloud(w * 0.74, h * 0.13, 1.0, stroke, 1.0);
  cloud(w * 0.84, h * 0.23, 0.72, lightStroke, 0.9);
  cloudSmall(w * 0.60, h * 0.18, 0.72, lightStroke);

  // 左下角主祥云（镜像）
  c.save();
  c.translate(w * 0.26, h * 0.87);
  c.scale(-1, -1);
  c.translate(-w * 0.26, -h * 0.87);
  cloud(w * 0.74, h * 0.13, 1.0, stroke, 1.0);
  cloud(w * 0.84, h * 0.23, 0.72, lightStroke, 0.9);
  cloudSmall(w * 0.60, h * 0.18, 0.72, lightStroke);
  c.restore();

  // 左上 / 右下（微淡，小号一朵）
  cloudSmall(w * 0.08 + margin*0.3, h * 0.08 + margin*0.3, 0.80, faintStroke);
  cloudSmall(w * 0.92 - margin*0.3, h * 0.92 - margin*0.3, 0.80, faintStroke);

  // 米黄款：四角再加描深边，让祥云"压边框"效果更强（与示例图一致）
  if (isXuan) {
    // 边框角点：45°斜线金边小饰
    c.save();
    c.strokeStyle = darkStroke;
    c.lineWidth = 2;
    c.lineCap = 'round';
    const mg = Math.min(w,h) * 0.05;
    // 左上 L 饰
    c.beginPath();
    c.moveTo(mg*1.2, mg*0.4); c.lineTo(mg*1.2, mg*1.2); c.lineTo(mg*0.4, mg*1.2);
    // 右上 L 饰
    c.moveTo(w - mg*1.2, mg*0.4); c.lineTo(w - mg*1.2, mg*1.2); c.lineTo(w - mg*0.4, mg*1.2);
    // 左下 L 饰
    c.moveTo(mg*0.4, h - mg*1.2); c.lineTo(mg*1.2, h - mg*1.2); c.lineTo(mg*1.2, h - mg*0.4);
    // 右下 L 饰
    c.moveTo(w - mg*0.4, h - mg*1.2); c.lineTo(w - mg*1.2, h - mg*1.2); c.lineTo(w - mg*1.2, h - mg*0.4);
    c.stroke();
    c.restore();
  }
}

// 双层金边（米黄款）
function drawDoubleGoldFrame(c, w, h) {
  c.save();
  // 外层（偏浅亮金，细）
  c.strokeStyle = '#e6c465';
  c.lineWidth = 2;
  c.strokeRect(1, 1, w - 2, h - 2);
  // 内层（偏暗熟金，粗）
  c.strokeStyle = '#b8891e';
  c.lineWidth = 6;
  c.strokeRect(8, 8, w - 16, h - 16);
  // 金线内侧再勾一圈淡金，增加层次
  c.strokeStyle = 'rgba(243,207,115,0.55)';
  c.lineWidth = 2;
  c.strokeRect(14, 14, w - 28, h - 28);
  // 金色内晕
  c.strokeStyle = 'rgba(199,153,42,0.10)';
  c.lineWidth = 28;
  c.strokeRect(8, 8, w - 16, h - 16);
  c.restore();
}

// 双层米白描边（米白款）
function drawDoubleWhiteFrame(c, w, h) {
  c.save();
  c.strokeStyle = '#ffffff';
  c.lineWidth = 1;
  c.strokeRect(0.5, 0.5, w - 1, h - 1);
  c.strokeStyle = 'rgba(215,195,150,0.88)';
  c.lineWidth = 3;
  c.strokeRect(4, 4, w - 8, h - 8);
  c.strokeStyle = 'rgba(215,195,150,0.22)';
  c.lineWidth = 20;
  c.strokeRect(4, 4, w - 8, h - 8);
  c.restore();
}

// 撒金（米黄款）
function drawGoldSplatter(c, w, h) {
  const N = Math.max(80, Math.round(w * h / 1800));
  const baseSeed = Math.floor(w * 7 + h * 13);
  function rnd(i) {
    let x = (baseSeed ^ (i * 1812433253)) >>> 0;
    x ^= x << 13; x ^= x >>> 17; x ^= x << 5;
    return ((x >>> 0) % 10000) / 10000;
  }
  c.save();
  // 亮金（主颗粒）
  for (let i = 0; i < N; i++) {
    const x = rnd(i * 3 + 1) * w;
    const y = rnd(i * 3 + 2) * h;
    const t = rnd(i * 3 + 3);
    if (t < 0.70) {
      // 正圆金点
      const r = 0.6 + rnd(i * 5 + 7) * 2.4;
      const col = rnd(i * 7 + 11) < 0.5 ? '#f6d87c' : '#e6bd4a';
      c.fillStyle = col;
      c.globalAlpha = 0.88;
      c.beginPath(); c.arc(x, y, r, 0, Math.PI * 2); c.fill();
    } else if (t < 0.90) {
      // 四角加稠的闪亮大星
      const corners = [
        [w*0.18, h*0.18],[w*0.82, h*0.18],[w*0.18, h*0.82],[w*0.82, h*0.82],
        [w*0.50, h*0.50]
      ];
      const cp = corners[i % corners.length];
      const dx = cp[0] + (rnd(i*11+13)-0.5) * Math.min(w,h) * 0.30;
      const dy = cp[1] + (rnd(i*11+17)-0.5) * Math.min(w,h) * 0.30;
      const r = 1.2 + rnd(i * 13 + 19) * 3.0;
      c.fillStyle = '#fff3bc';
      c.globalAlpha = 0.95;
      c.beginPath(); c.arc(dx, dy, r, 0, Math.PI * 2); c.fill();
      // 星芒
      c.globalAlpha = 0.55;
      c.strokeStyle = '#ffe9a8';
      c.lineWidth = 0.6;
      c.beginPath();
      c.moveTo(dx - r*2.2, dy); c.lineTo(dx + r*2.2, dy);
      c.moveTo(dx, dy - r*2.2); c.lineTo(dx, dy + r*2.2);
      c.stroke();
    } else {
      // 长条形碎金
      const ang = rnd(i*17+23) * Math.PI;
      const len = 2 + rnd(i*19+29) * 6;
      c.save();
      c.translate(x, y); c.rotate(ang);
      c.globalAlpha = 0.9;
      c.fillStyle = '#e9c360';
      c.fillRect(-len/2, -0.6, len, 1.2);
      c.restore();
    }
  }
  c.globalAlpha = 1;
  c.restore();
}

// 冰裂纹（米白款）
function drawIceCracks(c, w, h) {
  c.save();
  c.strokeStyle = 'rgba(191,167,116,0.55)';
  c.lineCap = 'round'; c.lineJoin = 'round';
  const SW = 600, SH = 600; // 基准尺寸
  const sx = w / SW, sy = h / SH;
  function line(x1,y1,x2,y2){ c.beginPath(); c.moveTo(x1*sx, y1*sy); c.lineTo(x2*sx, y2*sy); c.stroke(); }
  const lines = [
    [0,40,110,85],[110,85,200,50],[200,50,300,120],[300,120,390,90],[390,90,500,160],[500,160,600,120],
    [0,210,90,180],[90,180,180,260],[180,260,290,220],[290,220,400,300],[400,300,520,260],[520,260,600,330],
    [0,400,120,360],[120,360,240,440],[240,440,350,400],[350,400,460,480],[460,480,600,440],
    [40,0,80,110],[80,110,20,230],[20,230,100,340],[100,340,60,470],[60,470,140,600],
    [220,0,180,90],[180,90,260,180],[260,180,220,300],[220,300,300,410],[300,410,260,520],[260,520,340,600],
    [420,0,380,120],[380,120,460,210],[460,210,420,330],[420,330,500,430],[500,430,460,530],[460,530,540,600],
    [580,0,540,120],[540,120,600,230],[600,230,560,340],[560,340,600,450],
    [120,50,70,140],[70,140,150,210],[150,210,120,310],[120,310,200,380],[200,380,160,490],
    [300,70,240,170],[240,170,330,250],[330,250,290,360],[290,360,380,440],[380,440,330,550],
    [480,60,430,160],[430,160,510,240],[510,240,480,360],[480,360,550,450]
  ];
  c.lineWidth = 1.0;
  lines.forEach(seg => line(seg[0],seg[1],seg[2],seg[3]));
  // 额外的小分支裂纹
  for (let i = 0; i < lines.length; i += 2) {
    const s = lines[i];
    const mx = (s[0] + s[2]) * 0.5, my = (s[1] + s[3]) * 0.5;
    const ang = Math.atan2(s[3] - s[1], s[2] - s[0]) + (i % 4 === 0 ? Math.PI / 3 : -Math.PI / 3);
    const len = 30 + ((i * 37) % 40);
    line(mx, my, mx + Math.cos(ang) * len, my + Math.sin(ang) * len);
  }
  c.restore();
}

// 画宣纸纤维与暗斑（确定性散点，不依赖 Math.random 以免每次导出不同）
function drawRiceSpecks(c, w, h, alpha, darkRGBA, lightRGBA) {
  // 用基于尺寸的密度 + 一个 seed 函数，保证同样画面每次渲染一致
  const N = Math.max(40, Math.round(w * h / 9000));
  const baseSeed = Math.floor(w * 13 + h * 7);
  function rnd(i) {
    // xorshift-like mini hash
    let x = (baseSeed ^ (i * 2654435761)) >>> 0;
    x ^= x << 13; x ^= x >>> 17; x ^= x << 5;
    return ((x >>> 0) % 10000) / 10000;
  }
  c.save();
  for (let i = 0; i < N; i++) {
    const x = rnd(i * 3 + 1) * w;
    const y = rnd(i * 3 + 2) * h;
    const t = rnd(i * 3 + 3);
    if (t < 0.55) {
      // 小圆点暗斑
      const r = 0.5 + rnd(i * 7 + 11) * 1.6;
      c.fillStyle = darkRGBA;
      c.beginPath(); c.arc(x, y, r, 0, Math.PI * 2); c.fill();
    } else if (t < 0.85) {
      // 短纤维
      const ang = rnd(i * 11 + 17) * Math.PI;
      const len = 2 + rnd(i * 13 + 19) * 6;
      c.save();
      c.translate(x, y);
      c.rotate(ang);
      c.fillStyle = lightRGBA;
      c.fillRect(-len/2, -0.5, len, 1);
      c.restore();
    } else {
      // 大一点的浅晕
      const r = 1.5 + rnd(i * 17 + 23) * 3;
      c.fillStyle = lightRGBA;
      c.beginPath(); c.arc(x, y, r, 0, Math.PI * 2); c.fill();
    }
  }
  c.globalAlpha = alpha;
  c.restore();
}

$('#btn-save-work').addEventListener('click', async () => {
  const txt = state.createParams.text ? state.createParams.text : '请输入你心中的文案';
  const title = Array.from(txt).slice(0, 8).join('') || '无题';
  const hiCanvas = await renderToHiResCanvas();
  const thumb = hiCanvas.toDataURL('image/jpeg', 0.7);
  const id = 'w_' + Date.now() + '_' + Math.random().toString(36).slice(2, 7);
  const paramsSnapshot = JSON.parse(JSON.stringify(state.createParams));
  // —— BUGFIX：新作品绝对不能继承"之前打开过的老作品 params.bgBlobK"。
  //   createParams.bgBlobK 是"某一次加载作品后"遗留下来的 workBg:OLD_ID，
  //   如果不清理，新作品会把"其他作品专属的 bgBlobK"一起写进 params，
  //   造成 saveWorks 把该键对应的数据 OVEWRITE（覆盖老作品真正的背景图 / 新作品存错键）
  //   → 用户表象是："旧作品图被替换成新上传背景图 / 新作品保存后打开背景不对"。
  //   清除后，saveWorks 读到 bg==='custom' 会重新分配 bgBlobK = 'workBg:' + thisWork.id（完全独立）
  if (paramsSnapshot && typeof paramsSnapshot.bgBlobK === 'string') {
    delete paramsSnapshot.bgBlobK;
  }
  const newWork = {
    id, ts: Date.now(), title,
    params: paramsSnapshot,
    thumb
  };
  // custom 背景：新建作品时把"当时的 userBackgroundDataURL"挂到工作对象上
  //   → saveWorks 读到就会独立写入 blobs.workBg:<id>，避免后续上传新图覆盖
  if (paramsSnapshot.bg === 'custom') {
    if (typeof state.userBackgroundDataURL === 'string' && state.userBackgroundDataURL.startsWith('data:image/')) {
      newWork._bgDataURL = state.userBackgroundDataURL;
      // 同时给新作品预留专属 bgBlobK（saveWorks 也会再次分配，提前写一份保证一致）
      newWork.params.bgBlobK = 'workBg:' + id;
    } else {
      // 此时 custom 但没有真图数据，不允许强存 custom（防止白屏）→ 回退米黄
      newWork.params.bg = 'xuan';
    }
  }
  state.works.unshift(newWork);
  // 限制作品数量（超限后删掉尾部最旧作品 + 连带 blobs）
  if (state.works.length > 30) {
    const overflow = state.works.splice(30);
    for (const ow of overflow) {
      if (ow && ow.params && ow.params.bgBlobK && typeof ow.params.bgBlobK === 'string' && ow.params.bgBlobK.startsWith('workBg:')) {
        idbDel(IDB_STORE_BLOBS, ow.params.bgBlobK).catch(() => {});
      }
    }
  }
  await saveWorks();
  renderWorksPanel();
  showToast(`已保存作品：${title}`);
});

// 事件委托：加载作品 / 删除作品
$('#works-grid').addEventListener('click', (e) => {
  const delBtn = e.target.closest('[data-action="del-work"]');
  if (delBtn) {
    e.stopPropagation();
    const id = delBtn.dataset.id;
    if (confirm('删除该作品？')) {
      // 删除作品前先清理其独立保存的 custom 背景图（如果存在），避免 blobs 表留垃圾
      const target = state.works.find(x => x.id === id);
      if (target && target.params && target.params.bgBlobK
          && typeof target.params.bgBlobK === 'string'
          && target.params.bgBlobK.startsWith('workBg:')) {
        idbDel(IDB_STORE_BLOBS, target.params.bgBlobK).catch(() => {});
      }
      state.works = state.works.filter(w => w.id !== id);
      saveWorks();
      renderWorksPanel();
    }
    return;
  }
  const item = e.target.closest('.work-item');
  if (!item) return;
  const w = state.works.find(x => x.id === item.dataset.id);
  if (!w) return;
  const loadedParams = JSON.parse(JSON.stringify(w.params));
  // 旧版逐字微调字段（本轮已彻底删除）：兼容读取后清理，避免参数里留着旧的 charOverrides 脏数据
  if ('charOverrides' in loadedParams) delete loadedParams.charOverrides;
  state.createParams = loadedParams;

  // 异步收尾：custom 背景单独恢复数据 → syncBackground → refresh
  (async () => {
    let bgMsg = '';
    // ——— 判定：该作品是否属于「独立保存过 custom 背景图」。
    // 修正 V3：**绝不**用全局 state.userBackground 作为"是否 treatAsCustom 或兜底恢复"的依据，
    //   因为 userBackground = 创作页最后一次上传的图，和老作品 A 的自定义背景毫无关系；
    //   之前用它兜底会造成：作品 A 当年自定义了图A → 后来用户上传新图B → 打开作品 A 却看到了图B（严重错串）。
    //   仅当作品自己真的有独立数据（三种：params.bgBlobK / blobs 键 workBg:<w.id> / 会话内存 w._bgDataURL）才按 custom 打开；
    //   如果独立数据缺失了，统一走 normalizeBg(rawBg)，让『bg=xuanwhite 的老作品就回米白；bg=royal/letter 旧值也归到正确宣纸』
    const rawBg = (state.createParams && state.createParams.bg) ? state.createParams.bg : '';
    const hasBgBlobKInParams = !!(loadedParams.bgBlobK
      && typeof loadedParams.bgBlobK === 'string'
      && loadedParams.bgBlobK.startsWith('workBg:'));
    // 兜底探测：即使 params 没 bgBlobK 字段，也查一次 blobs 里 workBg:<workId> 是否存在（上轮迁移偶尔失败的场景）
    let recoveredBlobFallback = null;
    if (!hasBgBlobKInParams) {
      try {
        const probe = await idbGet(IDB_STORE_BLOBS, 'workBg:' + w.id);
        if (probe && typeof probe.dataURL === 'string' && probe.dataURL.startsWith('data:image/')) {
          recoveredBlobFallback = probe.dataURL;
          loadedParams.bgBlobK = 'workBg:' + w.id;
          state.createParams.bgBlobK = loadedParams.bgBlobK;
        }
      } catch(_) {}
    }
    const hasInSessionMemBg = typeof w !== 'undefined' && typeof w._bgDataURL === 'string' && w._bgDataURL.startsWith('data:image/');
    // 真正作品私有 custom 图的信号：三档命中其一
    const hasOwnCustomImage = !!(hasBgBlobKInParams || recoveredBlobFallback || hasInSessionMemBg);

    // —— treatAsCustom = 作品自己明确存着 custom 背景 = (a) bg=custom 且有私有图；(b) bg 其它奇怪值但有私有图
    const treatAsCustom = (rawBg === 'custom' && hasOwnCustomImage)
      || (typeof rawBg === 'string' && rawBg !== 'xuan' && rawBg !== 'xuanwhite' && hasOwnCustomImage);

    if (treatAsCustom) {
      state.createParams.bg = 'custom';
      loadedParams.bg = 'custom';

      let recovered = null;
      // 优先：params.bgBlobK 明确 → idbGet
      if (loadedParams.bgBlobK && typeof loadedParams.bgBlobK === 'string' && loadedParams.bgBlobK.startsWith('workBg:')) {
        try {
          const blobRec = await idbGet(IDB_STORE_BLOBS, loadedParams.bgBlobK);
          if (blobRec && typeof blobRec.dataURL === 'string' && blobRec.dataURL.startsWith('data:image/')) {
            recovered = blobRec.dataURL;
          }
        } catch(_) {}
      }
      // 兜底 1：没 bgBlobK 但 probe 命中 workBg:w.id（缺失字段场景）
      if (!recovered && recoveredBlobFallback) recovered = recoveredBlobFallback;
      // 兜底 2：会话内存 w._bgDataURL （会话内刚保存还未落盘，或用户刚刚修改但没保存的临时）
      if (!recovered && hasInSessionMemBg) recovered = w._bgDataURL;

      if (recovered) {
        // 注意：**不写入全局 userBackground**，
        //   防止"打开作品A时把它的背景图顶替成『创作页最后一次上传背景图』"。
        //   为了让用户编辑后立刻保存不会白屏，我们只把数据写回"该作品的 _bgDataURL / params.bgBlobK 对应 blobs 键"。
        state.userBackgroundDataURL = recovered; // 只在本次会话使用（syncBackground 注入自定义背景图必需的内存字段）
        try {
          // 把这个作品自己的数据重新落盘一次（如果之前 probe 命中就已存在，覆盖不会错；否则新建 bgBlobK 对应键）
          if (loadedParams.bgBlobK && typeof loadedParams.bgBlobK === 'string' && loadedParams.bgBlobK.startsWith('workBg:')) {
            await idbPut(IDB_STORE_BLOBS, { k: loadedParams.bgBlobK, dataURL: recovered, ts: Date.now(), wid: w.id });
          }
          if (typeof w !== 'undefined') w._bgDataURL = recovered;
        } catch(_) {}
      } else {
        // 自己的 private 图兜底三档全失败：回退 normalizeBg（不再默认米黄）
        const fallbackBg = normalizeBg(rawBg);
        state.createParams.bg = fallbackBg;
        delete state.createParams.bgBlobK;
        bgMsg = `（原自定义背景图已丢失，已回退${fallbackBg === 'xuanwhite' ? '米白宣纸' : '米黄宣纸'}）`;
      }
    } else {
      // 非 custom 作品：bg 值（包括 xuan / xuanwhite / royal / letter）走 normalizeBg 规范化，
      //   royal→xuan，letter→xuanwhite，非法→xuan，保证老作品也"按当年原始背景宣纸打开"（不是全部被替换成新上传的 custom 图）
      state.createParams.bg = normalizeBg(rawBg);
      delete state.createParams.bgBlobK; // 非 custom 不带 bgBlobK（下一次 saveWorks 也会清理）
    }
    saveLastCreate();
    syncCreateUIFromState();
    syncBackground();
    renderPaper();
    $('#works-panel').classList.remove('open');
    switchPage('create');
    showToast(`已加载「${w.title}」${bgMsg}`);
  })().catch(err => {
    // 极端异常兜底：至少把文字/布局渲染出来，提示用户
    saveLastCreate();
    syncCreateUIFromState();
    syncBackground();
    renderPaper();
    $('#works-panel').classList.remove('open');
    switchPage('create');
    showToast(`作品加载完成（背景异常：${err && err.message ? err.message : err}）`);
  });
});

// ============================================================
//  初始化
// ============================================================
// 背景枚举白名单 + 旧值迁移
function normalizeBg(bg) {
  if (bg === 'xuan' || bg === 'xuanwhite' || bg === 'custom') return bg;
  // 已被弃用的旧值：'letter' 更接近米白熟宣；'royal' → 回退默认米黄
  if (bg === 'letter') return 'xuanwhite';
  return 'xuan';
}

async function init() {
  // W1：init 默认打开采集页，采集页副标题大字强制 fit 一行
  requestAnimationFrame(() => fitSubtitleLine());

  // 先同步小容量 localStorage（立即可用的 UI 草稿）+ 背景迁移
  loadLastCreate();
  // 旧版本逐字微调字段 charOverrides（本轮删除）：如果 LSLastCreate 里带了，就从 state.createParams 里清掉
  if (state.createParams && 'charOverrides' in state.createParams) delete state.createParams.charOverrides;
  state.createParams.bg = normalizeBg(state.createParams.bg);

  // 恢复用户自定义创作背景图（必须在 syncBackground 之前）
  try { await loadUserBackground(); } catch(e){}
  // 若 bg=custom 但当前无用户背景图数据 → 自动回退米黄，避免纯白
  if (state.createParams.bg === 'custom' && !state.userBackgroundDataURL) {
    state.createParams.bg = 'xuan';
  }
  saveLastCreate();

  syncCreateUIFromState();
  updatePaperToggle();

  // 动态调整 header/main 偏移
  const syncHeaderOffset = () => {
    fitSubtitleLine();
    const headerH = Math.ceil($('#header').getBoundingClientRect().height || 84);
    $('#main').style.top = headerH + 'px';
  };
  syncHeaderOffset();

  // 读取持久化大字库/作品（IDB 为主）— 异步加载，等完成再刷新 UI
  try { await loadLibrary(); } catch(e){}
  try {
    await loadWorks();
    // 旧作品 bg 值兼容迁移（不修改用户原作品 id，只规范化 params.bg 字段）
    state.works.forEach(w => {
      if (w && w.params && typeof w.params.bg === 'string') {
        w.params.bg = normalizeBg(w.params.bg);
      }
    });
    // —— 旧 custom 作品背景补齐：本轮前作品 bg='custom' 但还没有独立 bgBlobK 的，
    //     只要当前"最后一次上传的背景图"存在（blobs.userBackground）就重建一份 workBg:<id>，
    //     保证"作品集以前上传的背景依然显示 & 修改保存回写"——
    //     若当前全局 userBackground 丢失，则仍交给作品加载时的三级兜底/回退米黄。
    const existingBlobKs = new Set();
    try {
      const all = await idbAll(IDB_STORE_BLOBS);
      for (const b of all || []) { if (b && typeof b.k === 'string') existingBlobKs.add(b.k); }
    } catch(_) {}
    if (typeof state.userBackgroundDataURL === 'string' && state.userBackgroundDataURL.startsWith('data:image/')) {
      const pendingPuts = [];
      for (const w of state.works) {
        if (!w || !w.params || w.params.bg !== 'custom') continue;
        const blobK = (w.params.bgBlobK && typeof w.params.bgBlobK === 'string' && w.params.bgBlobK.startsWith('workBg:'))
          ? w.params.bgBlobK
          : ('workBg:' + w.id);
        if (w.params.bgBlobK !== blobK) w.params.bgBlobK = blobK;
        if (!existingBlobKs.has(blobK)) {
          pendingPuts.push(idbPut(IDB_STORE_BLOBS, { k: blobK, dataURL: state.userBackgroundDataURL, ts: Date.now(), wid: w.id }).catch(() => false));
          existingBlobKs.add(blobK);
        }
      }
      if (pendingPuts.length) Promise.all(pendingPuts).catch(() => {});
    }
    // 顺手把规范化 + 补齐 bgBlobK 的结果写回存储（asyncAck=false 静默）
    saveWorks(false);
  } catch(e){}
  renderLibrary();
  renderWorksPanel();

  // 同步上传背景按钮底部小字提示
  const hint = $('#bg-custom-hint');
  if (hint) hint.textContent = state.userBackgroundDataURL ? '点此更换' : '点此选图';

  // 恢复最后一次上传的古籍原图（如果存在）
  try {
    const savedBlob = await idbGet(IDB_STORE_BLOBS, 'lastSourceImage');
    let viewInfo = null;
    try {
      const raw = localStorage.getItem(LS_SOURCE_VIEW);
      viewInfo = raw ? JSON.parse(raw) : null;
    } catch(e) { viewInfo = null; }
    if (savedBlob && savedBlob.dataURL) {
      try {
        const img = await loadImageFromDataURL(savedBlob.dataURL);
        state.image = img;
        state.lastSourceDataURL = savedBlob.dataURL;
        if (viewInfo && typeof viewInfo === 'object') {
          if (typeof viewInfo.rotation === 'number') state.rotation = viewInfo.rotation;
        }
        $('#collect-empty').style.display = 'none';
        $('#collect-editor').style.display = 'flex';
        resizeCollectCanvas();
        setTimeout(() => {
          resizeCollectCanvas();
          if (viewInfo && typeof viewInfo === 'object' && typeof viewInfo.scale === 'number') {
            // 恢复视图：若 scale 在合理范围就直接恢复，否则自适应
            let s = viewInfo.scale;
            let ox = viewInfo.offsetX;
            let oy = viewInfo.offsetY;
            if (!(s > 0 && s <= 10 && typeof ox === 'number' && typeof oy === 'number')) {
              fitImageToCanvas();
            } else {
              state.scale = s;
              state.offsetX = ox;
              state.offsetY = oy;
              drawCollectCanvas();
            }
          } else {
            fitImageToCanvas();
          }
        }, 50);
      } catch(e) { /* 图片损坏就不恢复 */ }
    }
  } catch(e){}

  // Initialize canvas size after layout
  const doLayout = () => {
    syncHeaderOffset();
    resizeCollectCanvas();
    renderPaper();
  };
  setTimeout(doLayout, 80);
  // 图片字体加载完再次刷新布局，避免尺寸抖动
  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(() => { setTimeout(doLayout, 40); fitSubtitleLine(); }).catch(()=>{});
  }
  window.addEventListener('resize', () => setTimeout(()=>{ doLayout(); fitSubtitleLine(); }, 100));
  // 部分输入法弹出/收起会改变可视高度，刷新 canvas + paper 排版
  window.addEventListener('orientationchange', () => setTimeout(()=>{ doLayout(); fitSubtitleLine(); }, 200));
  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', () => setTimeout(doLayout, 120));
  }
}
let __inited = false;
document.addEventListener('DOMContentLoaded', async () => {
  if (!__inited) { __inited = true; await init(); }
});
// Fallback in case DOMContentLoaded already fired
if (document.readyState !== 'loading' && !__inited) { __inited = true; init(); }

})();

// Service Worker 注册 - 离线缓存
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function() {
    navigator.serviceWorker.register('service-worker.js').catch(function(err) {
      console.log('SW registration failed:', err);
    });
  });
}
</script>
